name: Add Žavërk name gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-name-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add name gate
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          style = r'''<style id="zaverk-name-gate-style">
          body.zv-gate-locked{overflow:hidden}
          .zv-name-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:radial-gradient(700px 500px at 50% 20%,rgba(123,220,255,.11),transparent 65%),rgba(4,5,7,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
          .zv-name-card{width:min(480px,94vw);padding:32px;border:1px solid #343941;border-radius:24px;background:linear-gradient(145deg,#12151a,#090b0f);box-shadow:0 30px 100px rgba(0,0,0,.62);text-align:right;direction:rtl}
          .zv-name-mark{width:58px;height:58px;margin-bottom:22px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(123,220,255,.38);background:#0b1015;color:#7bdcff;font:800 25px 'Space Grotesk';box-shadow:0 0 0 8px rgba(123,220,255,.035)}
          .zv-name-eyebrow{margin:0 0 8px;color:#7bdcff;font:700 10px 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase}
          .zv-name-card h2{margin:0;color:#f4efe6;font-size:28px;letter-spacing:-.035em}
          .zv-name-card p{margin:10px 0 22px;color:#9d9a95;font-size:13px;line-height:1.9}
          .zv-name-label{display:block;margin-bottom:8px;color:#d8d2ca;font-size:12px;font-weight:700}
          .zv-name-input{width:100%;height:52px;border:1px solid #353a42;border-radius:13px;outline:0;background:#080a0d;color:#f4efe6;padding:0 15px;font:600 15px Vazirmatn;direction:rtl;transition:border-color .18s,box-shadow .18s}
          .zv-name-input:focus{border-color:#7bdcff;box-shadow:0 0 0 3px rgba(123,220,255,.12)}
          .zv-name-button{width:100%;margin-top:12px;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#b9e95d,#85ccd7);color:#080b08;font:800 12px Vazirmatn;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .18s}
          .zv-name-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(123,220,255,.16)}
          .zv-name-button:disabled{opacity:.42;cursor:not-allowed}
          .zv-name-warning{margin:13px 0 0!important;color:#ff866f!important;font-weight:800;font-size:12px!important;text-align:center}
          .zv-name-status{min-height:18px;margin:9px 0 0!important;color:#ffb3a5!important;font-size:11px!important;text-align:right}
          @media(max-width:520px){.zv-name-card{padding:25px;border-radius:20px}.zv-name-card h2{font-size:24px}}
          @media(prefers-reduced-motion:reduce){.zv-name-input,.zv-name-button{transition:none}}
          </style>'''

          markup = r'''<div class="zv-name-gate" id="zvNameGate" role="dialog" aria-modal="true" aria-labelledby="zvNameTitle">
            <div class="zv-name-card">
              <div class="zv-name-mark" aria-hidden="true">Ž</div>
              <p class="zv-name-eyebrow">ŽAVËRK ACCESS</p>
              <h2 id="zvNameTitle">قبل از ورود، اسمت رو بگو</h2>
              <p>برای ورود به مترجم ژاڤرک، اول اسم خودت رو وارد کن.</p>
              <label class="zv-name-label" for="zvNameInput">اسم شما</label>
              <input class="zv-name-input" id="zvNameInput" name="zaverk-name" type="text" autocomplete="name" maxlength="40" spellcheck="false" placeholder="مثلاً مهبد">
              <button class="zv-name-button" id="zvNameSubmit" type="button" disabled>ورود به ژاڤرک</button>
              <p class="zv-name-warning"><strong>فحش گذاشتم اگه دروغ بگی</strong></p>
              <p class="zv-name-status" id="zvNameStatus" aria-live="polite"></p>
            </div>
          </div>'''

          script = r'''<script id="zaverk-name-gate-script">
          (()=>{
            const gate=document.getElementById('zvNameGate');
            const input=document.getElementById('zvNameInput');
            const submit=document.getElementById('zvNameSubmit');
            const status=document.getElementById('zvNameStatus');
            if(!gate||!input||!submit)return;
            document.body.classList.add('zv-gate-locked');
            const sync=()=>{const name=input.value.trim();submit.disabled=name.length<2;status.textContent=name&&name.length<2?'اسم باید حداقل ۲ نویسه باشد.':''};
            const enter=()=>{const name=input.value.trim();if(name.length<2){sync();input.focus();return}gate.remove();document.body.classList.remove('zv-gate-locked');window.zaverkVisitorName=name};
            input.addEventListener('input',sync);
            input.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
            submit.addEventListener('click',enter);
            requestAnimationFrame(()=>input.focus());
            sync();
          })();
          </script>'''

          if 'id="zvNameGate"' not in text:
              text = text.replace('</head>', style + '\n</head>', 1)
              text = text.replace('<body>', '<body>\n' + markup, 1)
              text = text.replace('</body>', script + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Name gate already present; no change needed.')
      
      - name: Commit patch and remove installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-name-gate.yml
          git commit -m "feat: add visitor name gate" || true
          git rm .github/workflows/add-name-gate.yml
          git commit -m "chore: remove one-shot name gate installer"
          git push
