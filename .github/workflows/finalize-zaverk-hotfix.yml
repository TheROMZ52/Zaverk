name: Finalize Zaverk hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          sed -i 's/hreflang="en" href="https:\/\/theromz52.github.io\/Zaverk\/">//' index.html
          sed -i 's/"inLanguage":\["fa","en"\]/"inLanguage":["fa"]/' index.html
          sed -i "s/document.getElementById('inputText')/document.getElementById('input')/" index.html
          sed -i 's/try{localStorage.setItem('\''zaverkVisitorName'\'',name)}catch{}//' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-shot-zaverk-hotfix.yml .github/workflows/finalize-zaverk-hotfix.yml
          git commit -m "fix: finalize non-translator site fixes"
          git push
