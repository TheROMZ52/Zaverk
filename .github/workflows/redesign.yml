name: safe-visual-redesign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace visual layer only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#090a0d;--ink:#f4efe6;--soft:#b8b1a6;--muted:#7d7a76;--line:#292a2f;--line2:#3a3531;--panel:#111216e8;--panel2:#0c0d10f2;--blue:#7bdcff;--coral:#ff866f;--lime:#d8f56d;--violet:#9a83ff;--shadow:0 30px 90px rgba(0,0,0,.46);--r:22px}*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(900px 560px at 12% -8%,rgba(123,220,255,.12),transparent 60%),radial-gradient(860px 600px at 100% 8%,rgba(255,134,111,.11),transparent 60%),linear-gradient(180deg,#090a0d 0%,#07080b 55%,#0b0c10 100%);position:relative;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,#000,transparent 88%);opacity:.65}body:after{content:"";position:fixed;inset:auto -15% -16rem auto;width:34rem;height:34rem;border-radius:50%;border:1px solid rgba(216,245,109,.09);box-shadow:0 0 0 42px rgba(216,245,109,.025),0 0 0 84px rgba(216,245,109,.018);transform:rotate(-17deg);pointer-events:none}.shell{width:min(1240px,94vw);margin:auto;padding:28px 0 74px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:14px}.mark{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#1d3340,#0e1217 68%);border:1px solid rgba(123,220,255,.35);box-shadow:inset 0 0 0 7px rgba(255,255,255,.02),0 10px 40px rgba(123,220,255,.08);font:800 24px 'Space Grotesk';letter-spacing:-.08em}.mark:after{content:"";position:absolute;inset:-7px;border:1px dashed rgba(255,134,111,.25);border-radius:50%;animation:spin 18s linear infinite}.eyebrow{margin:0;color:var(--blue);font:700 10px 'Space Grotesk';letter-spacing:.18em;text-transform:uppercase}.brand h1{margin:2px 0 0;font-size:23px;letter-spacing:-.03em}.version{padding:8px 12px;border:1px solid var(--line2);color:var(--soft);font:600 11px 'Space Grotesk';letter-spacing:.05em;background:rgba(255,255,255,.02);white-space:nowrap}.hero,.translator,.section{position:relative;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.hero:before,.translator:before,.section:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.03) 45%,transparent 66%)}.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);min-height:440px;border-radius:30px}.hero-copy{padding:50px 44px 38px;position:relative}.hero-copy:after{content:"Ž";position:absolute;left:-10px;bottom:-68px;font:700 330px/.75 'Space Grotesk';color:transparent;-webkit-text-stroke:1px rgba(123,220,255,.08);opacity:.9;pointer-events:none}.hero h2{position:relative;z-index:1;margin:12px 0 0;font-size:clamp(48px,7vw,90px);line-height:.98;letter-spacing:-.065em;max-width:820px}.gradient{background:linear-gradient(100deg,var(--ink) 10%,var(--blue) 48%,var(--coral) 88%);-webkit-background-clip:text;background-clip:text;color:transparent}.desc{position:relative;z-index:1;max-width:640px;margin:20px 0 0;color:var(--soft);font-size:15px;line-height:2.05}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;position:relative;z-index:1}.chip{padding:8px 11px;border:1px solid #343438;background:#0f1014;color:#c7c1b9;font-size:11px;border-radius:10px}.chip:nth-child(2){border-color:rgba(123,220,255,.25)}.chip:nth-child(3){border-color:rgba(216,245,109,.23)}.alphabet{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;position:relative;z-index:1;max-width:720px}.glyph{min-width:34px;padding:7px 8px;text-align:center;background:#0c0e12;border:1px solid #272a2f;color:#dbf6ff;border-radius:9px;direction:ltr;font:600 14px 'Space Grotesk';transition:transform .2s,border-color .2s,background .2s}.glyph:hover{transform:translateY(-3px);border-color:rgba(123,220,255,.42);background:#10151a}.info{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-inline-start:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent)}.info:after{content:"LANGUAGE / SPECIMENS";position:absolute;top:22px;right:28px;color:#68645f;font:600 9px 'Space Grotesk';letter-spacing:.14em}.info-title{display:flex;justify-content:space-between;align-items:center;color:#ddd7cf;font-size:13px;margin-bottom:4px}.signal{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 20px rgba(216,245,109,.7)}.example{padding:15px 16px;margin:0;border:1px solid #2c2d31;background:rgba(5,7,9,.48);border-radius:14px;transition:transform .2s,border-color .2s}.example:hover{transform:translateX(-3px);border-color:#45464b}.example small{display:block;color:#73716d;margin-bottom:6px;font:600 9px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase}.example strong{display:block;font-size:16px}.example span{display:block;margin-top:6px;color:var(--blue);direction:ltr;text-align:left;font:700 16px/1.4 'Space Grotesk'}.translator{margin-top:18px;border-radius:26px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.012)}.mode,.toolbar-actions,.mini-actions{display:flex;align-items:center;gap:8px}.mode{direction:ltr;color:#8b8883;font:600 12px 'Space Grotesk'}.mode-badge{min-width:138px;padding:11px 12px;border-radius:12px;background:#0c0f13;border:1px solid #30343a;color:#e4dfd7;outline:0;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s}.mode-badge:hover{border-color:#565b62}.mode-badge:focus-visible,.btn:focus-visible,.editor:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.btn{border:1px solid #2e3136;background:#0d0f13;color:#e9e4dc;border-radius:12px;padding:10px 13px;font:600 11px Vazirmatn;cursor:pointer;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}.btn:hover{transform:translateY(-2px);border-color:#50545b;background:#111419}.btn.primary{background:linear-gradient(135deg,#b9e95d,#85ccd7);border-color:transparent;color:#0a0e0a;box-shadow:0 8px 28px rgba(216,245,109,.14)}.btn.primary:hover{box-shadow:0 12px 34px rgba(123,220,255,.18)}.panes{display:grid;grid-template-columns:1fr 92px 1fr;gap:14px;padding:14px}.pane{min-width:0;background:#090b0f;border:1px solid #23272d;border-radius:20px;overflow:hidden;position:relative}.pane:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(123,220,255,.025),transparent 28%)}.pane-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #202329}.pane-head h3{margin:0;font-size:12px;color:#dad4cb}.lang{color:#727a82;font:700 9px 'Space Grotesk';letter-spacing:.12em}.editor{width:100%;height:320px;resize:none;outline:0;border:0;background:transparent;color:#f2eee7;padding:20px;font:500 17px/2 Vazirmatn;position:relative;z-index:1}.editor::selection{background:rgba(123,220,255,.22)}.editor.output{direction:ltr;text-align:left;font-family:'Space Grotesk',Vazirmatn;font-size:18px;color:#c9f3ff}.pane-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #202329;color:#6d6e70;font-size:10px}.bridge{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}.bridge:before{content:"";position:absolute;width:1px;height:70%;background:linear-gradient(180deg,transparent,#2f3034,transparent)}.bridge:after{content:"Ž";position:absolute;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#0b0d10;border:1px solid #2c2f34;box-shadow:0 0 0 8px rgba(9,10,13,.92);color:#45484e;font:700 18px 'Space Grotesk';z-index:0}.bridge .btn{position:relative;z-index:1}.swap{width:56px;height:56px;padding:0;border-radius:50%;font-size:20px;background:#101317}.translate{min-width:78px}.status{min-height:22px;margin:0 14px 14px;padding:11px 13px;border-radius:12px;color:#9fb6c0;background:#0c1115;border:1px solid #202a31;font-size:11px}.status.error{color:#ffd0d6;border-color:#5b3039;background:#1b0e12}.footer{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.section{border-radius:22px;padding:22px}.section h2{margin:0 0 14px;color:#ddd7cf;font-size:14px}.word-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.word{padding:11px;border:1px solid #25282d;background:#0b0d11;border-radius:13px;transition:transform .18s,border-color .18s}.word:hover{transform:translateY(-2px);border-color:#41454b}.word b{display:block;color:var(--blue);direction:ltr;text-align:left;font:600 13px 'Space Grotesk'}.word span{color:#77736e;font-size:10px}.examples{display:grid;gap:8px}.example-btn{width:100%;padding:13px 14px;text-align:right;background:#0b0d11;border:1px solid #25282d;border-radius:13px;color:#bdb6ad;cursor:pointer;transition:transform .18s,border-color .18s,background .18s}.example-btn:hover{transform:translateX(-3px);border-color:#41454b;background:#0e1014}.example-btn strong{display:block;color:#e8e2d9;font-size:12px}.example-btn span{display:block;margin-top:5px;color:#7ccfe7;direction:ltr;text-align:left;font:600 11px 'Space Grotesk'}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border:1px solid #3b4148;background:#0a0d11;color:#f1ece4;border-radius:13px;transition:.22s;pointer-events:none;z-index:8;box-shadow:0 12px 36px rgba(0,0,0,.35);font-size:11px}.toast.show{opacity:1;transform:translate(-50%,0)}.noscript{margin:16px auto;padding:12px;border:1px solid #5b3039;background:#1b0e12;border-radius:12px;width:min(1240px,94vw);color:#ffd0d6}::selection{background:rgba(216,245,109,.22);color:#fff}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.top,.hero,.translator,.footer{animation:rise .65s cubic-bezier(.2,.7,.2,1) both}.translator{animation-delay:.06s}.footer{animation-delay:.12s}@media(max-width:900px){.hero{grid-template-columns:1fr}.info{border-inline-start:0;border-top:1px solid var(--line)}.word-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{width:94vw;padding-top:18px}.top{align-items:flex-start}.mark{width:48px;height:48px}.brand h1{font-size:20px}.version{font-size:10px}.hero-copy{padding:34px 24px 28px}.hero h2{font-size:clamp(42px,14vw,68px)}.hero-copy:after{font-size:220px;bottom:-35px}.info{padding:24px}.toolbar{flex-wrap:wrap}.mode{width:100%;justify-content:center}.toolbar-actions{width:100%;justify-content:center}.panes{grid-template-columns:1fr;padding:9px}.bridge{flex-direction:row;order:3;min-height:76px}.bridge:before{width:72%;height:1px;background:linear-gradient(90deg,transparent,#2f3034,transparent)}.bridge:after{width:48px;height:48px}.editor{height:260px}.word-grid{grid-template-columns:repeat(2,1fr)}.pane-foot{align-items:flex-start;flex-wrap:wrap}.mode-badge{min-width:132px}.footer{grid-template-columns:1fr}.chip{font-size:10px}.alphabet{gap:5px}.glyph{min-width:31px;padding:6px 7px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.top,.hero,.translator,.footer{animation:none}.mark:after,.glyph,.btn,.word,.example,.example-btn{transition:none;animation:none}}
'''
          ns, n = re.subn(r'<style>.*?</style>', '<style>\n'+css+'\n</style>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('style block not found')
          p.write_text(ns, encoding='utf-8')
          print('visual layer replaced')
          PY

      - name: Commit visual redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "design: launch Žavërk instrument deck"
          git push