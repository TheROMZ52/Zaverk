<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت ورودهای ژاڤرک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080a0d;--panel:#101318;--line:#292f36;--text:#f4efe6;--muted:#9299a1;--blue:#7bdcff;--lime:#d8f56d;--coral:#ff866f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 15% 0,rgba(123,220,255,.1),transparent 60%),radial-gradient(820px 520px at 100% 0,rgba(255,134,111,.08),transparent 60%),linear-gradient(180deg,#080a0d,#07090c 70%,#0b0d11);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}main{width:min(1040px,94vw);margin:auto;padding:42px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border:1px solid rgba(123,220,255,.35);border-radius:50%;display:grid;place-items:center;color:var(--blue);font:800 21px 'Space Grotesk';background:#0d1218}.eyebrow{margin:0 0 4px;color:var(--blue);font:700 10px 'Space Grotesk';letter-spacing:.16em}.top h1{margin:0;font-size:23px}.home{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:11px}.card{background:rgba(16,19,24,.94);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.38)}.gate{width:min(520px,100%);margin:70px auto 0}.gate h2,.panel h2{margin:0 0 8px;font-size:19px}.gate p,.meta{color:var(--muted);line-height:1.9;font-size:12px}.field{display:flex;gap:9px;margin-top:18px}.input{flex:1;min-width:0;height:48px;border:1px solid #333942;border-radius:12px;background:#090c10;color:var(--text);padding:0 14px;outline:0;font:600 14px Vazirmatn}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(123,220,255,.1)}button{font:700 12px Vazirmatn;cursor:pointer}.primary{border:0;border-radius:12px;padding:0 18px;background:linear-gradient(135deg,#c1ee63,#84d1db);color:#081008}.status{min-height:20px;margin-top:10px;color:var(--coral);font-size:11px}.panel{display:none}.panel.show{display:block}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.refresh{border:1px solid var(--line);background:#0d1015;color:var(--text);padding:9px 12px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.stat{padding:16px;border:1px solid #242a31;border-radius:14px;background:#0b0e12}.stat b{display:block;font:700 23px 'Space Grotesk';color:var(--blue)}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.table-wrap{overflow:auto;border:1px solid #242a31;border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:520px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #20252b;text-align:right;font-size:11px}.table th{color:#adb4bc;background:#0c1015;position:sticky;top:0}.table td{color:#ddd8d0}.table td:first-child{color:var(--muted);font-family:'Space Grotesk'}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid rgba(216,245,109,.2);background:rgba(216,245,109,.05);color:var(--lime);font-size:10px}@media(max-width:620px){main{padding-top:24px}.top{align-items:flex-start}.top h1{font-size:19px}.home{font-size:11px}.field{flex-direction:column}.primary{height:48px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand"><div class="mark">Ž</div><div><p class="eyebrow">ŽAVËRK ADMIN</p><h1>ورودهای سایت</h1></div></div><a class="home" href="./">بازگشت به مترجم</a></header>
<section class="card gate" id="gate"><h2>ورود به پنل مدیریت</h2><p>برای دیدن فهرست افرادی که وارد مترجم شده‌اند، رمز مدیریت را وارد کن.</p><div class="field"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="رمز مدیریت"><button class="primary" id="login" type="button">ورود</button></div><div class="status" id="status" aria-live="polite"></div></section>
<section class="card panel" id="panel"><div class="panel-head"><div><h2>فهرست ورودها</h2><div class="meta" id="lastUpdated">در حال بارگذاری…</div></div><button class="refresh" id="refresh" type="button">بازخوانی</button></div><div class="stats"><div class="stat"><b id="total">۰</b><span>تعداد ورودهای ثبت‌شده</span></div><div class="stat"><b class="badge">فعال</b><span>دسترسی پنل</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>نام</th><th>زمان ورود</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>هنوز ورودی ثبت نشده.</div></div></section>
</main>
<script>
'use strict';
const SUPABASE_URL='https://fjzhkprnxznijwmjrlka.supabase.co';
const SUPABASE_KEY='sb_publishable_OeU6Z8Yn_rPuxfKRsMApqw__kcMQIKA';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),gate=$('gate'),panel=$('panel'),password=$('password'),status=$('status'),rows=$('rows'),empty=$('empty');
const render=visitors=>{rows.innerHTML=visitors.map((v,i)=>'<tr><td>'+(i+1).toLocaleString('fa-IR')+'</td><td>'+escapeHtml(v.name)+'</td><td>'+new Date(v.entered_at).toLocaleString('fa-IR')+'</td></tr>').join('');empty.hidden=visitors.length>0;$('total').textContent=visitors.length.toLocaleString('fa-IR');$('lastUpdated').textContent='آخرین بازخوانی: '+new Date().toLocaleString('fa-IR')};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){status.textContent='';$('lastUpdated').textContent='در حال بارگذاری…';try{const res=await fetch(SUPABASE_URL+'/functions/v1/zaverk-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({password:window.zaverkAdminPassword})});const data=await res.json();if(!res.ok)throw new Error(data.error==='invalid_password'?'رمز اشتباه است.':'دریافت فهرست ناموفق بود.');render(data.visitors||[])}catch(e){status.textContent=e.message||'خطا در اتصال.';gate.style.display='block';panel.classList.remove('show')}}
async function login(){const value=password.value;if(!value){status.textContent='رمز را وارد کن.';password.focus();return}window.zaverkAdminPassword=value;gate.style.display='none';panel.classList.add('show');await load();if(status.textContent)gate.style.display='block'}
$('login').addEventListener('click',login);password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('refresh').addEventListener('click',load);password.focus();
</script>
</body>
</html>
