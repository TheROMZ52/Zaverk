<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubka Control</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><div><small>RUBKA CONTROL</small><h1>مرکز کنترل بات</h1></div><span id="status" class="pill">● در حال اتصال</span></header>
<main>
<section class="stats">
<div><span>پیام دریافتی</span><strong id="in">0</strong></div>
<div><span>پیام ارسالی</span><strong id="out">0</strong></div>
<div><span>چت‌های دیده‌شده</span><strong id="chatsCount">0</strong></div>
<div><span>ارسال فعال</span><strong id="tasks">0</strong></div>
</section>
<section class="layout">
<aside class="panel"><div class="panelHead"><h2>چت‌ها</h2><input id="search" placeholder="جستجوی چت..."></div><div id="chatList" class="chatList"></div></aside>
<section class="panel messages"><div class="panelHead"><h2>پیام‌های زنده</h2><button id="stop">توقف همه</button></div><div id="stream" class="stream"></div></section>
<aside class="panel composer"><h2>ارسال پیام</h2><label>Chat ID<input id="chatId" placeholder="c..." dir="ltr"></label><label>متن پیام<textarea id="text" rows="6" placeholder="پیامت را بنویس..."></textarea></label><div class="row"><label>Delay (ثانیه)<input id="delay" type="number" min="1" value="1"></label><label>تعداد<input id="count" type="number" min="1" max="100" value="1"></label></div><button id="send" class="primary">ارسال</button><p id="error" class="error"></p></aside>
</section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
