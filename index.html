<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مترجم ژاڤرک</title>
<style>
:root{--bg:#071018;--panel:#0d1b27;--line:#1c3547;--text:#ecf8ff;--muted:#91a9b8;--accent:#64e8ff;--accent2:#9b7cff;--danger:#ff6680}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#15324a 0,#071018 42%,#04090d 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1100px,92%);margin:auto;padding:45px 0}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(32px,6vw,64px);margin:0;background:linear-gradient(90deg,var(--accent),#fff,var(--accent2));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}.card{background:linear-gradient(180deg,#102332,#0a151e);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 55px #0007}.label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:10px;font-weight:700}.lang{color:var(--accent)}textarea{width:100%;height:330px;resize:vertical;min-height:220px;background:#061019;color:var(--text);border:1px solid #193447;border-radius:14px;padding:16px;font:18px/1.9 Tahoma,Arial,sans-serif;outline:none}textarea:focus{border-color:var(--accent)}.controls{display:flex;flex-direction:column;justify-content:center;gap:10px}.btn{border:1px solid var(--line);background:#102331;color:var(--text);border-radius:13px;padding:12px 15px;cursor:pointer;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 25px #0005}.primary{background:linear-gradient(135deg,#15556b,#49377f);border-color:#4b8da5}.danger{border-color:#572638}.tools{display:flex;gap:10px;margin-top:12px}.tools .btn{flex:1}.section{margin-top:18px}.section h2{margin:0 0 12px}.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.word{background:#0b1924;border:1px solid var(--line);border-radius:12px;padding:11px}.word b{color:var(--accent);display:block}.word span{color:var(--muted)}.status{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}@media(max-width:750px){.grid{grid-template-columns:1fr}.controls{flex-direction:row;justify-content:center}.controls .btn{flex:1}textarea{height:250px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>ژاڤرک</h1><p>Žavërk Translator — مترجم فارسی ↔ ژاڤرک</p></section>
<section class="grid">
<div class="card"><div class="label"><span>ورودی</span><span class="lang" id="fromLang">فارسی</span></div><textarea id="input" placeholder="مثلاً: علی بریم بازی؟"></textarea><div class="tools"><button class="btn" id="clear">پاک کردن</button><button class="btn" id="copyInput">کپی</button></div></div>
<div class="controls"><button class="btn primary" id="swap">⇄ جابه‌جایی</button><button class="btn primary" id="translate">ترجمه</button></div>
<div class="card"><div class="label"><span>خروجی</span><span class="lang" id="toLang">ژاڤرک</span></div><textarea id="output" readonly placeholder="نتیجه ترجمه اینجا نمایش داده می‌شود..."></textarea><div class="tools"><button class="btn" id="copyOutput">کپی نتیجه</button></div></div>
</section>
<section class="card section"><h2>واژه‌های پایه</h2><div class="words" id="words"></div><div class="status" id="status">آماده ترجمه</div></section>
</main>
<script>
const faToZv={
'سلام':'SØLA','درود':'SØLA','خداحافظ':'VØRA','من':'MØ','تو':'ŦA','او':'ЯË','ما':'MØN','شما':'ŦAN','آنها':'ЯËN','دوست':'VËR','دوستان':'VËRIM','خانه':'ZØM','شهر':'RËK','آب':'MÏR','آتش':'FØR','زمین':'ƵAN','آسمان':'ØR','شب':'NËK','روز':'SØL','خوب':'VËR','بد':'ǤAR','بزرگ':'ƵAK','کوچک':'NÏK','سریع':'SËR','کند':'DØL','عجیب':'KЯØ','قوی':'VØK','ضعیف':'NËM','رفتن':'VEX','رفتم':'VEXØ','می‌روم':'VEXA','میروم':'VEXA','خواهم رفت':'VEXU','آمدن':'KËM','آمدم':'KËMØ','می‌آیم':'KËMA','میام':'KËMA','دیدن':'DRA','می‌بینم':'DRAA','خوردن':'MØK','می‌خورم':'MØKA','نوشیدن':'SËV','می‌نوشم':'SËVA','ساختن':'KRA','دارم':'ƇËRA','داشتن':'ƇËR','دوست داشتن':'LØV','دوستت دارم':'MØ ŦA LØVA','گفتن':'ЯAK','هستم':'BEA','هستی':'BEA','هست':'BEA','هستیم':'BËA','هستید':'BËA','هستند':'BËA','نمی':'NΞ','نه':'NΞ','آره':'ËVA','بله':'ËVA','بازی':'ƵËM','بریم':'VEXA'
};
const zvToFa=Object.fromEntries(Object.entries(faToZv).map(([a,b])=>[b,a]));
const phrases=[['علی بریم بازی؟','ALI MØN ƵËM VEXA؟'],['من تو را دوست دارم','MØ ŦA LØVA'],['سلام دوست من','SØLA VËR MØ'],['خداحافظ دوست من','VØRA VËR MØ']];
const nums={'۰':'ZËR','۱':'UN','۲':'DU','۳':'TЯI','۴':'KAR','۵':'PËN','۶':'SÏX','۷':'SËV','۸':'ØK','۹':'NÏN','۱۰':'DËK'};
const input=document.getElementById('input'),output=document.getElementById('output');let direction='fa';
function normalize(s){return s.replace(/[ي]/g,'ی').replace(/[ك]/g,'ک').replace(/\u200c/g,'‌').trim();}
function translateFA(s){s=normalize(s);for(const [a,b] of phrases)if(s===a)return b;let out=s;const keys=Object.keys(faToZv).sort((a,b)=>b.length-a.length);for(const k of keys)out=out.replaceAll(k,faToZv[k]);out=out.replace(/[۰-۹]+/g,m=>[...m].map(x=>nums[x]||x).join(' '));return out.replace(/\s+([؟?!.,])/g,'$1');}
function translateZV(s){s=s.trim();let out=s;const keys=Object.keys(zvToFa).sort((a,b)=>b.length-a.length);for(const k of keys)out=out.replaceAll(k,zvToFa[k]);return out;}
function translate(){const s=input.value;output.value=direction==='fa'?translateFA(s):translateZV(s);document.getElementById('status').textContent='ترجمه انجام شد';}
document.getElementById('translate').onclick=translate;
document.getElementById('swap').onclick=()=>{direction=direction==='fa'?'zv':'fa';document.getElementById('fromLang').textContent=direction==='fa'?'فارسی':'ژاڤرک';document.getElementById('toLang').textContent=direction==='fa'?'ژاڤرک':'فارسی';input.value=output.value;output.value='';};
document.getElementById('clear').onclick=()=>{input.value='';output.value='';document.getElementById('status').textContent='آماده ترجمه';};
document.getElementById('copyInput').onclick=()=>navigator.clipboard.writeText(input.value);
document.getElementById('copyOutput').onclick=()=>navigator.clipboard.writeText(output.value);
const words=[['SØLA','سلام'],['MØ','من'],['ŦA','تو'],['VËR','دوست / خوب'],['ZØM','خانه'],['RËK','شهر'],['MÏR','آب'],['VEXA','می‌روم / بریم'],['KËMA','می‌آیم'],['LØVA','دوست داشتن'],['ƵËM','بازی'],['VØRA','خداحافظ']];document.getElementById('words').innerHTML=words.map(x=>`<div class="word"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
</script>
</body>
</html>
